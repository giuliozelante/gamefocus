[package]
name = "gamefocus-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI for gamefocus sessions"
default-run = "gamefocus"

[[bin]]
name = "gamefocus"
path = "src/main.rs"

[dependencies]
gamefocus-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
gamefocus-linux = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
gamefocus-windows = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
gamefocus-macos = { workspace = true }
