name = "default-macos"
description = "Safe embedded default: park common browsers and chat apps; keep Discord. No Boost provider on macOS yet."

[[park]]
process_name = "Google Chrome"

[[park]]
process_name = "firefox"

[[park]]
process_name = "Spotify"

[[park]]
process_name = "Slack"

[[whitelist]]
process_name = "Steam"

[[whitelist]]
process_name = "Discord"

[[whitelist]]
process_name = "gamefocus"

[focus]
enabled = true
action = "suspend"
protect_shell = true

[boost]
enabled = true
providers = []
