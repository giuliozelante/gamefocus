name = "default-linux"
description = "Embedded default: park browsers, chat, Cursor, Java/Gradle, and llama-server. GameMode when available."

[[park]]
process_name = "chrome"

[[park]]
process_name = "chromium"

[[park]]
process_name = "firefox"

[[park]]
process_name = "Discord"

[[park]]
process_name = "discord"

[[park]]
process_name = "spotify"

[[park]]
process_name = "Slack"

[[park]]
process_name = "slack"

[[park]]
process_name = "cursor"

[[park]]
cmdline = "/tmp/.mount_Cursor"

[[park]]
process_name = "java"

[[park]]
process_name = "llama-server"

[[park]]
cmdline = "llama-server"

[[whitelist]]
process_name = "steam"

[[whitelist]]
process_name = "gamefocus"

[focus]
enabled = true
action = "suspend"
protect_shell = true

[boost]
enabled = true
providers = ["gamemode"]

[gpu.vram_reclaim]
policy = "prompt"
threshold_mib = 500
reclaimable_patterns = [
  "*llama*",
  "*ollama*",
  "*vllm*",
  "*localai*",
  "*text-generation*",
  "*comfyui*",
  "*stable-diffusion*",
]
