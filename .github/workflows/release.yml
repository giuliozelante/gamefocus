name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: gamefocus
            archive: gamefocus-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: gamefocus.exe
            archive: gamefocus-windows-x86_64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: gamefocus
            archive: gamefocus-macos-aarch64.tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release -p gamefocus-cli --target ${{ matrix.target }}
      - name: Pack
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${TARGET}/release/${BIN}"
          # Relative dist/ path: absolute Windows paths like D:\… make BSD/GNU tar
          # treat D: as a remote host ("Cannot connect to D: resolve failed").
          if [[ "$ARCHIVE" == *.zip ]]; then
            tar -C "$(dirname "$src")" -a -cf "dist/$ARCHIVE" "$(basename "$src")"
          else
            tar -C "$(dirname "$src")" -czf "dist/$ARCHIVE" "$(basename "$src")"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

  publish:
    name: publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/**
          generate_release_notes: true
          body: |
            ## Platforms

            | OS | Artifact |
            |----|----------|
            | Linux x64 | `gamefocus-linux-x86_64.tar.gz` (CLI `gamefocus`) |
            | Windows x64 | `gamefocus-windows-x86_64.zip` (CLI `gamefocus.exe`) |
            | macOS arm64 | `gamefocus-macos-aarch64.tar.gz` (CLI `gamefocus`) |

            Tray/UI installers (`.deb` / `.msi` / `.dmg`) are not in this release yet.
